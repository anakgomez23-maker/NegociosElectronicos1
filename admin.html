<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administrador | Ana Kaidien</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="admin-body">
    <header class="admin-encabezado">
        <a href="index.html" class="logo">Ana Kaidien<span>Creaciones Artesanales</span></a>
        <div class="admin-encabezado-info">
            <span>Panel de administrador</span>
            <a href="login.html" class="admin-cerrar">Cerrar sesión</a>
        </div>
    </header>

    <aside class="admin-sidebar" aria-label="Navegación administrativa">
        <p class="admin-sidebar-titulo">Gestión</p>
        <nav>
            <a class="admin-nav-enlace admin-nav-activo" href="admin-productos.html" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 3v5M16 3v5M4 10h16" /></svg>
                <span>Productos</span>
            </a>
            <a class="admin-nav-enlace" href="admin-pedidos.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg>
                <span>Pedidos</span>
            </a>
            <a class="admin-nav-enlace" href="admin-promociones.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z" /></svg>
                <span>Promociones</span>
            </a>
        </nav>
    </aside>

    <main class="admin-contenido">
        <div class="admin-titulo">
            <p class="subtitulo">Vista general</p>
            <h1>Resumen general</h1>
            <p>Consulta el estado de tu tienda en un solo lugar.</p>
        </div>

        <section class="admin-resumen" aria-label="Métricas de la tienda">
            <article class="admin-card">
                <div class="admin-card-icono admin-icono-rosa">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 3v5M16 3v5M4 10h16" /></svg>
                </div>
                <strong>12</strong>
                <span>Productos</span>
            </article>
            <article class="admin-card">
                <div class="admin-card-icono admin-icono-azul">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg>
                </div>
                <strong>5</strong>
                <span>Pedidos</span>
            </article>
            <article class="admin-card">
                <div class="admin-card-icono admin-icono-naranja">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z" /></svg>
                </div>
                <strong>2</strong>
                <span>Promociones activas</span>
            </article>
            <article class="admin-card">
                <div class="admin-card-icono admin-icono-verde">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M16 7.5c0-1.7-1.7-3-4-3S8 5.8 8 7.5s1.7 2.5 4 3 4 1.3 4 3-1.7 3-4 3-4-1.3-4-3" /></svg>
                </div>
                <strong>$3,450 <small>MXN</small></strong>
                <span>Ventas del mes</span>
            </article>
        </section>
    </main>
</body>

</html>
